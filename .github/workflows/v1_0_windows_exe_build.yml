name: Ver.1.0 Windows GUI compile and minimal smoke

on:
  push:
    branches:
      - 'build/v1.0-repackage'
    paths:
      - 'build_tools/distribution_app/**'
      - '.github/workflows/v1_0_windows_exe_build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile portable GUI
        shell: pwsh
        run: |
          dotnet publish .\build_tools\distribution_app\DonOriginal3DMusic3.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\build_temp
          if ($LASTEXITCODE -ne 0) { throw 'C# distribution GUI failed to compile' }
          if (!(Test-Path .\build_temp\DonOriginal3DMusic3.exe)) { throw 'Missing GUI EXE' }
          $app=(Resolve-Path .\build_temp\DonOriginal3DMusic3.exe).Path
          $info=[Diagnostics.FileVersionInfo]::GetVersionInfo($app)
          if ($info.FileVersion -ne '1.0.0.0') { throw "Unexpected FileVersion: $($info.FileVersion)" }
          if ($info.ProductVersion -ne '1.0.0.0') { throw "Unexpected ProductVersion: $($info.ProductVersion)" }
          Write-Host 'V100_WINDOWS_EXE_COMPILED'
      - name: Run actual v1.0 GUI EXE self-test
        shell: pwsh
        run: |
          $app=(Resolve-Path .\\build_temp\\DonOriginal3DMusic3.exe).Path
          $testLog=Join-Path $env:TEMP 'DonOriginal3DMusic3_v1.0_selftest_failure.txt'
          Remove-Item -LiteralPath $testLog -ErrorAction SilentlyContinue
          $job=Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($job.ExitCode -ne 0) {
            if (Test-Path $testLog) { Get-Content $testLog }
            throw "v1.0 GUI EXE self-test failed with $($job.ExitCode)"
          }
          Write-Host 'V100_WINDOWS_GUI_SELF_TEST_PASSED'
      - name: Explicitly mark binary as NOT YET READY FOR PUBLIC DISTRIBUTION
        shell: pwsh
        run: |
          Write-Host 'EXE compilation and synthetic tests are not full HUTUBS/IoSR/HTDemucs audio QA.'
          Write-Host 'The genuine 513,598,015-byte v1.48 archive must be verified and packaged first.'
      - uses: actions/upload-artifact@v4
        with:
          name: DonOriginal3DMusic3_v1.0_Exe_ONLY_NOT_DISTRIBUTION
          path: build_temp/DonOriginal3DMusic3.exe
          retention-days: 7
          if-no-files-found: error
# This artifact is deliberately NOT the public ZIP.
# Official distribution must additionally verify the genuine v1.48 asset ZIP,
# third-party redistribution terms, and audio with H3 SOFA and HTDemucs.
